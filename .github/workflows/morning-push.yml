name: Morning push

# GitHub runs cron in UTC and often starts a few minutes late. Two runs cover Eastern standard
# and daylight time. The script sends only between 8 and 10 am local, once per day.
on:
  schedule:
    - cron: "11 12,13 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the clock and the once-a-day guard"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      APP_URL: https://lambertmichael-ai.github.io/peerless/
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the push secrets exist
        id: gate
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "The FIREBASE_SERVICE_ACCOUNT secret is not set yet. See docs/SETUP.md. Nothing sent."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci --omit=dev
      - if: steps.gate.outputs.ready == 'true'
        run: node scripts/send-push.mjs ${{ inputs.force && '--force' || '' }}
